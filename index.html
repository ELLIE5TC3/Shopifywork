<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipeable Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 0;
        }

        .gallery-section {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 55px;
            position: relative;
        }

        .gallery-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .gallery-wrapper {
            display: flex;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .gallery-slide {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            min-width: 100%;
            padding: 30px;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item.placeholder {
            background: linear-gradient(135deg, #e0e0e0 0%, #f0f0f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        /* Navigation Arrows (Desktop Only) */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
            z-index: 10;
            opacity: 0.9;
        }

        .nav-arrow:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: translateY(-50%) scale(0.9);
        }

        .nav-arrow.prev {
            left: 20px;
        }

        .nav-arrow.next {
            right: 20px;
        }

        .nav-arrow svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        /* Dots Navigation */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            padding: 0;
        }

        .dot.active {
            background: #007bff;
            transform: scale(1.2);
        }

        .dot:hover {
            background: #007bff;
            opacity: 0.7;
        }

        /* Hidden state */
        .hidden {
            display: none !important;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .gallery-section {
                padding: 0 30px;
            }
            
            .gallery-slide {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .gallery-section {
                padding: 0 20px;
            }
            
            .gallery-slide {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 15px;
            }

            /* Hide arrows on mobile */
            .nav-arrow {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .gallery-section {
                padding: 0 15px;
            }
            
            .gallery-slide {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 15px;
            }
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #666;
        }

        /* Demo styles */
        .demo-controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .demo-controls button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .demo-controls button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="demo-controls">
        <button onclick="loadSampleImages()">Load Sample Images</button>
        <button onclick="clearImages()">Clear Images</button>
        <button onclick="addRandomImages()">Add More Images</button>
    </div>

    <div class="gallery-section">
        <div class="gallery-container">
            <div class="gallery-wrapper" id="galleryWrapper">
                <!-- Slides will be generated here -->
            </div>
            
            <!-- Navigation Arrows (Desktop Only) -->
            <button class="nav-arrow prev" id="prevBtn" onclick="previousSlide()">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <button class="nav-arrow next" id="nextBtn" onclick="nextSlide()">
                <svg viewBox="0 0 24 24">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </div>
        
        <!-- Dots Navigation -->
        <div class="dots-container" id="dotsContainer">
            <!-- Dots will be generated here -->
        </div>
    </div>

    <script>
        class SwipeableGallery {
            constructor() {
                this.images = [];
                this.currentSlide = 0;
                this.itemsPerSlide = 4; // Default for desktop
                this.touchStartX = 0;
                this.touchEndX = 0;
                this.isDragging = false;
                this.startX = 0;
                this.currentX = 0;
                this.initialTransform = 0;
                
                this.init();
            }

            init() {
                this.updateItemsPerSlide();
                this.setupEventListeners();
                this.render();
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    this.updateItemsPerSlide();
                    this.render();
                });
            }

            updateItemsPerSlide() {
                const width = window.innerWidth;
                if (width <= 480) {
                    this.itemsPerSlide = 1;
                } else if (width <= 768) {
                    this.itemsPerSlide = 2;
                } else if (width <= 1024) {
                    this.itemsPerSlide = 3;
                } else {
                    this.itemsPerSlide = 4;
                }
            }

            setupEventListeners() {
                const wrapper = document.getElementById('galleryWrapper');
                
                // Touch events for mobile
                wrapper.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: true });
                wrapper.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
                wrapper.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: true });
                
                // Mouse events for desktop
                wrapper.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                wrapper.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                wrapper.addEventListener('mouseup', (e) => this.handleMouseUp(e));
                wrapper.addEventListener('mouseleave', (e) => this.handleMouseUp(e));
                
                // Prevent context menu on long press
                wrapper.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            handleTouchStart(e) {
                this.touchStartX = e.touches[0].clientX;
                this.startDrag(e.touches[0].clientX);
            }

            handleTouchMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                this.touchEndX = e.touches[0].clientX;
                this.updateDrag(e.touches[0].clientX);
            }

            handleTouchEnd(e) {
                if (!this.isDragging) return;
                this.endDrag();
                this.handleSwipe();
            }

            handleMouseDown(e) {
                e.preventDefault();
                this.startDrag(e.clientX);
            }

            handleMouseMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                this.updateDrag(e.clientX);
            }

            handleMouseUp(e) {
                if (!this.isDragging) return;
                this.endDrag();
                this.handleSwipe();
            }

            startDrag(clientX) {
                this.isDragging = true;
                this.startX = clientX;
                this.currentX = clientX;
                this.initialTransform = this.currentSlide * -100;
                
                const wrapper = document.getElementById('galleryWrapper');
                wrapper.style.transition = 'none';
            }

            updateDrag(clientX) {
                this.currentX = clientX;
                const diff = this.currentX - this.startX;
                const percentage = (diff / window.innerWidth) * 100;
                const newTransform = this.initialTransform + percentage;
                
                const wrapper = document.getElementById('galleryWrapper');
                wrapper.style.transform = `translateX(${newTransform}%)`;
            }

            endDrag() {
                this.isDragging = false;
                const wrapper = document.getElementById('galleryWrapper');
                wrapper.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            }

            handleSwipe() {
                const diff = this.currentX - this.startX;
                const threshold = 50; // Minimum distance for swipe
                
                if (Math.abs(diff) > threshold) {
                    if (diff > 0 && this.currentSlide > 0) {
                        this.previousSlide();
                    } else if (diff < 0 && this.currentSlide < this.getTotalSlides() - 1) {
                        this.nextSlide();
                    } else {
                        this.goToSlide(this.currentSlide); // Snap back
                    }
                } else {
                    this.goToSlide(this.currentSlide); // Snap back
                }
            }

            addImages(imageUrls) {
                this.images.push(...imageUrls);
                this.render();
            }

            clearImages() {
                this.images = [];
                this.currentSlide = 0;
                this.render();
            }

            getTotalSlides() {
                if (this.images.length === 0) return 0;
                return Math.ceil(this.images.length / this.itemsPerSlide);
            }

            render() {
                const wrapper = document.getElementById('galleryWrapper');
                const dotsContainer = document.getElementById('dotsContainer');
                
                if (this.images.length === 0) {
                    wrapper.innerHTML = '<div class="loading">No images to display</div>';
                    dotsContainer.classList.add('hidden');
                    this.updateNavigationButtons();
                    return;
                }

                const totalSlides = this.getTotalSlides();
                
                // Generate slides
                let slidesHTML = '';
                for (let i = 0; i < totalSlides; i++) {
                    const startIndex = i * this.itemsPerSlide;
                    const endIndex = Math.min(startIndex + this.itemsPerSlide, this.images.length);
                    
                    slidesHTML += '<div class="gallery-slide">';
                    
                    // Add actual images
                    for (let j = startIndex; j < endIndex; j++) {
                        slidesHTML += `
                            <div class="gallery-item">
                                <img src="${this.images[j]}" alt="Gallery image ${j + 1}" loading="lazy">
                            </div>
                        `;
                    }
                    
                    // Add placeholder items if needed (only for the last slide)
                    if (i === totalSlides - 1) {
                        const remainingSlots = this.itemsPerSlide - (endIndex - startIndex);
                        for (let k = 0; k < remainingSlots; k++) {
                            slidesHTML += '<div class="gallery-item placeholder">Empty</div>';
                        }
                    }
                    
                    slidesHTML += '</div>';
                }
                
                wrapper.innerHTML = slidesHTML;
                
                // Generate dots (only show if more than 1 slide)
                if (totalSlides > 1) {
                    let dotsHTML = '';
                    for (let i = 0; i < totalSlides; i++) {
                        dotsHTML += `<button class="dot ${i === this.currentSlide ? 'active' : ''}" onclick="gallery.goToSlide(${i})"></button>`;
                    }
                    dotsContainer.innerHTML = dotsHTML;
                    dotsContainer.classList.remove('hidden');
                } else {
                    dotsContainer.classList.add('hidden');
                }
                
                // Ensure current slide is within bounds
                if (this.currentSlide >= totalSlides) {
                    this.currentSlide = Math.max(0, totalSlides - 1);
                }
                
                this.goToSlide(this.currentSlide);
                this.updateNavigationButtons();
            }

            goToSlide(slideIndex) {
                const totalSlides = this.getTotalSlides();
                if (slideIndex < 0 || slideIndex >= totalSlides) return;
                
                this.currentSlide = slideIndex;
                const wrapper = document.getElementById('galleryWrapper');
                wrapper.style.transform = `translateX(-${slideIndex * 100}%)`;
                
                // Update dots
                const dots = document.querySelectorAll('.dot');
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === slideIndex);
                });
                
                this.updateNavigationButtons();
            }

            nextSlide() {
                if (this.currentSlide < this.getTotalSlides() - 1) {
                    this.goToSlide(this.currentSlide + 1);
                }
            }

            previousSlide() {
                if (this.currentSlide > 0) {
                    this.goToSlide(this.currentSlide - 1);
                }
            }

            updateNavigationButtons() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const totalSlides = this.getTotalSlides();
                
                if (totalSlides <= 1) {
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                } else {
                    prevBtn.style.display = 'flex';
                    nextBtn.style.display = 'flex';
                    
                    prevBtn.disabled = this.currentSlide === 0;
                    nextBtn.disabled = this.currentSlide === totalSlides - 1;
                }
            }
        }

        // Initialize gallery
        const gallery = new SwipeableGallery();

        // Demo functions
        function loadSampleImages() {
            const sampleImages = [
                'https://picsum.photos/400/400?random=1',
                'https://picsum.photos/400/400?random=2',
                'https://picsum.photos/400/400?random=3',
                'https://picsum.photos/400/400?random=4',
                'https://picsum.photos/400/400?random=5',
                'https://picsum.photos/400/400?random=6',
                'https://picsum.photos/400/400?random=7',
                'https://picsum.photos/400/400?random=8',
                'https://picsum.photos/400/400?random=9',
                'https://picsum.photos/400/400?random=10'
            ];
            gallery.clearImages();
            gallery.addImages(sampleImages);
        }

        function clearImages() {
            gallery.clearImages();
        }

        function addRandomImages() {
            const randomImages = [];
            const startNum = Math.floor(Math.random() * 1000);
            for (let i = 0; i < 4; i++) {
                randomImages.push(`https://picsum.photos/400/400?random=${startNum + i}`);
            }
            gallery.addImages(randomImages);
        }

        function nextSlide() {
            gallery.nextSlide();
        }

        function previousSlide() {
            gallery.previousSlide();
        }

        // Load sample images on page load
        window.addEventListener('load', () => {
            loadSampleImages();
        });
    </script>
</body>
</html>
